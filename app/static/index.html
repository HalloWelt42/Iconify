<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iconify</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" data-mode="browse">
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> Iconify <span class="ver" id="ver">v3.0.0</span></div>
    <div class="modesw">
      <button class="on" data-mode="browse">Stöbern</button>
      <button data-mode="workshop" title="Eigenes Set kuratieren">Werkstatt</button>
    </div>
    <div class="top-right">
      <button class="kbd" data-act="cmdk">⌘K</button>
      <button class="iconbtn" data-act="theme" title="Hell / Dunkel / Auto">◐</button>
      <button class="iconbtn" data-act="settings" title="Einstellungen (KI / LM-Studio)">⚙</button>
    </div>
  </header>

  <div class="searchwrap">
    <div class="search">
      <span class="mag"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
      <input id="q" placeholder="Icons durchsuchen…" autocomplete="off">
      <select class="scope" id="scope">
        <option value="all">Alle Sets</option>
        <option value="set">Aktuelles Set</option>
        <option value="custom">Eigene Sets</option>
      </select>
      <button class="aibtn" data-act="ai" title="KI-Prosa-Suche (LM-Studio)">✨ KI</button>
    </div>
  </div>

  <div class="appearance">
    <div class="grp"><span class="grp-l">Farbe</span>
      <button class="colorbtn" id="colorbtn" title="Material-Palette"></button>
      <div class="palettepop" id="palettepop" hidden></div>
    </div>
    <div class="grp"><span class="grp-l">Größe</span><input type="range" min="20" max="80" value="40" id="size"></div>
    <div class="grp"><span class="grp-l">Hintergrund</span><div class="seg" data-seg="bg">
      <button class="on" data-v="light">Hell</button><button data-v="dark">Dunkel</button><button data-v="checker">Transp.</button>
    </div></div>
    <div class="sep"></div>
    <div class="grp"><span class="grp-l">Dichte</span><div class="seg" data-seg="dens">
      <button class="on" data-v="comf">Komfort</button><button data-v="comp">Kompakt</button>
    </div></div>
    <span class="spacer"></span>
    <span class="count"><b id="cnt">–</b> Treffer</span>
  </div>

  <div class="body">
    <aside class="facets">
      <div class="facet-h">Sets</div>
      <div id="sets" class="sets"></div>
      <div class="facet-h">Lizenz</div>
      <div class="chips" id="lic">
        <button class="chip on" data-lic="">Alle</button>
        <button class="chip" data-lic="permissive">Frei</button>
        <button class="chip" data-lic="attribution">Namensnennung</button>
        <button class="chip" data-lic="with">Mit</button>
        <button class="chip" data-lic="without">Ohne</button>
      </div>
      <div class="facet-h" id="styleh" hidden>Stil</div>
      <div id="styles" class="chips"></div>
    </aside>
    <main class="results" id="results">
      <div class="grid" id="grid"></div>
      <div class="sentinel" id="sentinel"></div>
      <div class="empty" id="empty" hidden></div>
    </main>
    <aside class="wpane" id="wpane">
      <div class="wpane-h">
        <select id="wset"></select>
        <button class="iconbtn" data-act="newset" title="Neues eigenes Set">+</button>
      </div>
      <div class="wpane-body wtarget" id="wtarget">
        <div class="grid" id="wgrid" style="--tile-min:78px;--tile-gap:8px"></div>
        <div class="wempty" id="wempty">Icons aus der Mitte hierher ziehen.</div>
      </div>
      <div class="wexport">
        <button class="btn primary span2" data-act="exp-font">Icon-Font erzeugen</button>
        <button class="btn" data-act="exp-zip">SVG-ZIP</button>
        <button class="btn" data-act="exp-sprite">Sprite</button>
      </div>
    </aside>
  </div>

  <!-- Detail -->
  <div class="scrim" id="scrim">
    <aside class="drawer" data-stop>
      <div class="drawer-h"><b id="dname">—</b><button class="iconbtn" data-act="closed" aria-label="Schließen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="drawer-body">
        <div class="dpreview" id="dprev"></div>
        <div class="block-h">Größe <span id="dsizev">128px</span></div>
        <input type="range" min="16" max="256" value="128" id="dsize" style="width:100%">
        <button class="block-h palhead" data-act="togglepal" style="margin-top:12px">Farbe
          <span class="palhead-r"><span class="colorchip" id="dchip"></span><span id="palcaret">▸</span></span></button>
        <div class="palette" id="dpal" hidden></div>
        <div class="block-h" style="margin-top:14px">Code</div>
        <div class="ctabs" id="ctabs"><button class="ctab on" data-t="svg">SVG</button><button class="ctab" data-t="img">IMG</button><button class="ctab" data-t="font">Font</button><button class="ctab" data-t="css">CSS</button></div>
        <pre class="code" id="code">—</pre>
        <div class="license" id="dlic"></div>
      </div>
      <div class="drawer-actions">
        <button class="btn primary" data-act="copysvg">SVG kopieren</button>
        <button class="btn" data-act="dl">Download</button>
      </div>
    </aside>
  </div>

  <!-- ⌘K -->
  <div class="cmdk" id="cmdk">
    <div class="cmdk-box" data-stop>
      <input id="cmdq" placeholder="Icon suchen… (Enter kopiert das erste)">
      <div class="cmdk-list" id="cmdlist"></div>
    </div>
  </div>

  <!-- Einstellungen (KI / LM-Studio) -->
  <div class="modal" id="settings">
    <div class="modal-box" data-stop>
      <div class="modal-h"><b>Einstellungen — KI-Suche (LM-Studio)</b><button class="iconbtn" data-act="closeset" aria-label="Schließen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
      <div class="modal-body">
        <label class="fld"><span>LM-Studio URL</span><input id="llm-url" placeholder="http://192.168.178.51:1234"></label>
        <label class="fld"><span>Modell (leer = automatisch)</span><input id="llm-model" placeholder="(automatisch)"></label>
        <label class="fld row"><input type="checkbox" id="llm-enabled"> KI-Suche aktiv</label>
        <div class="llm-status" id="llm-status">—</div>
        <div class="modal-actions">
          <button class="btn" data-act="llm-test">Verbindung testen</button>
          <button class="btn primary" data-act="llm-save">Speichern</button>
        </div>
        <p class="hint">KI ist optional. Ohne erreichbares LM-Studio funktioniert die normale Stichwort-Suche unverändert weiter.</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
